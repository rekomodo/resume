name: Build and Release Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'resume.tex'
      - 'sections/**'
      - 'Makefile'
      - '.github/workflows/build-resume-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: resume-latest
          name: Latest Resume
          body: |
            Automatically built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            Download `resume.pdf` below.
          artifacts: resume.pdf
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
